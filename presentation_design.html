<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDILOGUE 簡報背景設計</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slide-container {
            width: 960px; /* 16:9 Ratio Base */
            height: 540px;
            margin: 40px auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            border: 1px solid #eee;
            background: white;
        }
        .label {
            position: absolute;
            top: -25px;
            left: 0;
            font-size: 12px;
            font-weight: bold;
            color: #666;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-gray-100 p-10 font-sans">

    <div class="max-w-5xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">MEDILOGUE 簡報背景模板 (16:9)</h1>
        <p class="text-gray-500 text-sm mb-10">請調整瀏覽器至適當解析度後，對下方容器進行截圖即可使用。</p>

        <!-- 1. Title Slide -->
        <div class="relative">
            <div class="label">01. 封面頁 / Title Slide</div>
            <div class="slide-container bg-[#2D4D47] flex items-center justify-center">
                <!-- Abstract Background SVG -->
                <svg class="absolute inset-0 w-full h-full opacity-20" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path d="M0,100 C30,80 50,110 100,80 L100,100 L0,100 Z" fill="#7D8C7D"></path>
                    <path d="M0,0 C20,30 40,10 100,40 L100,0 L0,0 Z" fill="#1C332F"></path>
                </svg>
                <div class="relative z-10 text-center">
                    <div class="w-16 h-1 bg-emerald-400 mx-auto mb-6"></div>
                    <div class="text-white/20 text-8xl font-black tracking-tighter absolute -top-12 left-1/2 -translate-x-1/2 select-none">
                        MEDILOGUE
                    </div>
                </div>
                <!-- UI Elements -->
                <div class="absolute bottom-10 right-10 flex items-center gap-2">
                    <div class="w-6 h-6 bg-white/10 rounded"></div>
                    <div class="text-white/40 text-[10px] tracking-widest uppercase">Connecting Care</div>
                </div>
            </div>
        </div>

        <!-- 2. Content Slide -->
        <div class="relative mt-20">
            <div class="label">02. 內容頁 / General Content</div>
            <div class="slide-container bg-white border-l-[40px] border-[#2D4D47]">
                <!-- Subtle Grid -->
                <div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#2D4D47 1px, transparent 1px); background-size: 20px 20px;"></div>
                <div class="absolute top-10 right-10 text-[#2D4D47]/10 font-black text-4xl">01</div>
                <div class="absolute bottom-6 left-10 text-gray-400 text-[10px]">MEDILOGUE | AI Medical Humanism</div>
            </div>
        </div>

        <!-- 3. Section Divider -->
        <div class="relative mt-20">
            <div class="label">03. 章節分隔頁 / Section Divider</div>
            <div class="slide-container flex">
                <div class="w-1/2 bg-[#2D4D47] flex items-center justify-center p-12">
                     <div class="text-emerald-400 font-black text-6xl opacity-20">SECTION</div>
                </div>
                <div class="w-1/2 bg-[#F8FAFB] relative px-12 flex flex-col justify-center">
                    <div class="w-12 h-1 bg-[#2D4D47] mb-4"></div>
                    <div class="text-gray-300 text-[10px] uppercase tracking-[0.3em]">Next Chapter</div>
                </div>
            </div>
        </div>

        <!-- 4. Tech / AI Focused -->
        <div class="relative mt-20">
            <div class="label">04. AI 技術展示頁 / Tech Showcase</div>
            <div class="slide-container bg-[#1C332F]">
                <!-- Digital Neural Pattern -->
                <svg class="absolute inset-0 w-full h-full opacity-10" viewBox="0 0 100 100">
                    <circle cx="20" cy="20" r="1" fill="white" />
                    <circle cx="50" cy="30" r="1" fill="white" />
                    <circle cx="80" cy="20" r="1" fill="white" />
                    <circle cx="30" cy="70" r="1" fill="white" />
                    <circle cx="70" cy="80" r="1" fill="white" />
                    <circle cx="50" cy="50" r="1" fill="white" />
                    <line x1="20" y1="20" x2="50" y2="30" stroke="white" stroke-width="0.1" />
                    <line x1="50" y1="30" x2="80" y2="20" stroke="white" stroke-width="0.1" />
                    <line x1="50" y1="30" x2="50" y2="50" stroke="white" stroke-width="0.1" />
                    <line x1="50" y1="50" x2="30" y2="70" stroke="white" stroke-width="0.1" />
                    <line x1="50" y1="50" x2="70" y2="80" stroke="white" stroke-width="0.1" />
                </svg>
                <div class="absolute bottom-10 left-10 border-l-2 border-emerald-400 pl-4">
                    <div class="text-emerald-400 text-xs font-bold font-mono tracking-widest">SYSTEM_STATUS: ACTIVE</div>
                    <div class="text-white/20 text-[10px] uppercase">Generative AI Engine Enabled</div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
