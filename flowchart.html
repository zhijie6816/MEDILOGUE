<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDILOGUE 系統流程圖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: #F8FAFB; }
        .flow-line { height: 2px; background: linear-gradient(90deg, #2D4D47 0%, #7D8C7D 100%); }
        .node-card { transition: transform 0.3s ease, border-color 0.3s ease; }
        .node-card:hover { transform: translateY(-5px); border-color: #2D4D47; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-10">

    <div class="max-w-6xl w-full bg-white rounded-[3rem] shadow-2xl p-16 border border-gray-100 relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute top-0 right-0 w-64 h-64 bg-emerald-50 rounded-full blur-3xl opacity-50 -mr-20 -mt-20"></div>
        <div class="absolute bottom-0 left-0 w-64 h-64 bg-blue-50 rounded-full blur-3xl opacity-50 -ml-20 -mb-20"></div>

        <div class="relative z-10">
            <header class="text-center mb-16">
                <div class="inline-block px-4 py-1.5 bg-emerald-50 text-[#2D4D47] text-[10px] font-bold tracking-[0.3em] rounded-full mb-4 uppercase">
                    Platform Ecosystem
                </div>
                <h1 class="text-4xl font-black text-gray-900 mb-4 tracking-tighter">MEDILOGUE 學習旅程圖</h1>
                <p class="text-gray-500 text-sm">從虛擬臨床到專業反思：全方位醫療溝通培訓流程</p>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-7 gap-4 items-center">
                <!-- STEP 01 -->
                <div class="col-span-1 flex flex-col items-center">
                    <div class="node-card w-full p-6 bg-white border border-gray-100 rounded-3xl shadow-sm text-center">
                        <div class="w-12 h-12 bg-gray-900 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 font-bold">01</div>
                        <h3 class="text-sm font-bold text-gray-800 mb-1">登入首頁</h3>
                        <p class="text-[10px] text-gray-400">身份驗證與場域準備</p>
                    </div>
                </div>

                <div class="hidden md:block col-span-1 text-center font-bold text-emerald-200">→</div>

                <!-- STEP 02 -->
                <div class="col-span-1 flex flex-col items-center">
                    <div class="node-card w-full p-6 bg-white border border-gray-100 rounded-3xl shadow-sm text-center">
                        <div class="w-12 h-12 bg-emerald-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 font-bold">02</div>
                        <h3 class="text-sm font-bold text-gray-800 mb-1">案情選擇</h3>
                        <p class="text-[10px] text-gray-400">14種臨床挑戰教案</p>
                    </div>
                </div>

                <div class="hidden md:block col-span-1 text-center font-bold text-emerald-200">→</div>

                <!-- STEP 03 -->
                <div class="col-span-1 flex flex-col items-center">
                    <div class="node-card w-full p-6 bg-[#2D4D47] border-white/20 rounded-3xl shadow-lg text-center scale-110 ring-8 ring-emerald-50">
                        <div class="w-12 h-12 bg-white text-[#2D4D47] rounded-2xl flex items-center justify-center mx-auto mb-4 font-bold">03</div>
                        <h3 class="text-sm font-bold text-white mb-1">模擬對話</h3>
                        <p class="text-[10px] text-emerald-100/60">第一人稱醫病溝通</p>
                    </div>
                </div>

                <div class="hidden md:block col-span-1 text-center font-bold text-emerald-200">→</div>

                <!-- STEP 04 -->
                <div class="col-span-1 flex flex-col items-center">
                    <div class="node-card w-full p-6 bg-white border border-gray-100 rounded-3xl shadow-sm text-center">
                        <div class="w-12 h-12 bg-emerald-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 font-bold">04</div>
                        <h3 class="text-sm font-bold text-gray-800 mb-1">IPE 協作</h3>
                        <p class="text-[10px] text-gray-400">跨專業團隊資訊傳遞</p>
                    </div>
                </div>
            </div>

            <!-- Second Row Integration -->
            <div class="flex justify-center my-12 hidden md:flex">
                <div class="w-px h-12 bg-gradient-to-b from-gray-100 to-emerald-200"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-5 gap-6 items-center">
                <div class="col-span-1"></div>
                
                <!-- STEP 05 -->
                <div class="col-span-1 flex flex-col items-center">
                    <div class="node-card w-full p-6 bg-white border border-gray-100 rounded-3xl shadow-sm text-center">
                        <div class="w-12 h-12 bg-gray-200 text-gray-600 rounded-2xl flex items-center justify-center mx-auto mb-4 font-bold">05</div>
                        <h3 class="text-sm font-bold text-gray-800 mb-1">學習反思</h3>
                        <p class="text-[10px] text-gray-400">反思倫理決策關鍵點</p>
                    </div>
                </div>

                <div class="hidden md:block col-span-1 text-center font-bold text-emerald-200">→</div>

                <!-- STEP 06 -->
                <div class="col-span-1 flex flex-col items-center">
                    <div class="node-card w-full p-6 bg-emerald-50 border-emerald-100 border rounded-3xl shadow-sm text-center">
                        <div class="w-12 h-12 bg-emerald-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 font-bold">06</div>
                        <h3 class="text-sm font-bold text-emerald-900 mb-1">AI 深度評估</h3>
                        <p class="text-[10px] text-emerald-700/60">共情、中立與專業分析</p>
                    </div>
                </div>

                <div class="hidden md:block col-span-1 text-center font-bold text-emerald-200">→</div>

                <!-- STEP 07 -->
                <div class="col-span-1 flex flex-col items-center">
                    <div class="node-card w-full p-6 bg-gray-900 border-none rounded-3xl shadow-xl text-center">
                        <div class="w-12 h-12 bg-white text-gray-900 rounded-2xl flex items-center justify-center mx-auto mb-4 font-bold">07</div>
                        <h3 class="text-sm font-bold text-white mb-1">申請覆核</h3>
                        <p class="text-[10px] text-gray-400">生成報告與導師指導</p>
                    </div>
                </div>
            </div>

            <footer class="mt-20 pt-10 border-t border-gray-50 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-[#2D4D47] rounded-lg"></div>
                    <span class="font-bold text-gray-800 tracking-tighter">MEDILOGUE</span>
                </div>
                <p class="text-[10px] text-gray-400 uppercase tracking-widest">© 2026 AI Smart Medical Training System</p>
            </footer>
        </div>
    </div>

</body>
</html>
